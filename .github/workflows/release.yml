name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v1.0.0, v2.1.3, etc.

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          arch: 'win64_msvc2022_64'
          modules: 'qtnetworkauth'
      
      - name: Configure CMake
        run: |
          cmake -B build -S EmsNotify -DCMAKE_BUILD_TYPE=Release -G "Visual Studio 17 2022" -A x64
      
      - name: Build
        run: cmake --build build --config Release
      
      - name: Deploy Qt Dependencies
        run: |
          mkdir deploy
          cp build/Release/EmsNotify.exe deploy/
          windeployqt deploy/EmsNotify.exe
      
      - name: Install Inno Setup
        run: choco install innosetup -y
      
      - name: Build Installer
        run: |
          iscc EmsNotify/emsnotify.iss
      
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: deploy/
      
      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: EmsNotify/EMSNotifySetup.exe

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            qt6-base-dev \
            qt6-base-dev-tools \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libvulkan-dev \
            libxcb-cursor0 \
            rpm \
            patchelf \
            file \
            libfuse2
      
      - name: Build
        run: |
          cd EmsNotify
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j$(nproc)
      
      - name: Create AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          
          # Copy binary
          cp EmsNotify/build/EmsNotify AppDir/usr/bin/
          
          # Create desktop file
          cat > AppDir/usr/share/applications/emsnotify.desktop << EOF
          [Desktop Entry]
          Type=Application
          Name=EMS Notify
          Exec=EmsNotify
          Icon=emsnotify
          Categories=Utility;
          Terminal=false
          EOF
          
          # Copy icon
          cp EmsNotify/resources/icons/clock.png AppDir/usr/share/icons/hicolor/256x256/apps/emsnotify.png
      
      - name: Build AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          
          export QMAKE=/usr/lib/qt6/bin/qmake
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage
      
      - name: Build DEB
        run: |
          mkdir -p deb-package/DEBIAN
          mkdir -p deb-package/usr/bin
          mkdir -p deb-package/usr/share/applications
          mkdir -p deb-package/usr/share/icons/hicolor/256x256/apps
          
          # Copy files
          cp EmsNotify/build/EmsNotify deb-package/usr/bin/
          cp AppDir/usr/share/applications/emsnotify.desktop deb-package/usr/share/applications/
          cp EmsNotify/resources/icons/clock.png deb-package/usr/share/icons/hicolor/256x256/apps/emsnotify.png
          
          # Create control file
          cat > deb-package/DEBIAN/control << EOF
          Package: emsnotify
          Version: ${GITHUB_REF#refs/tags/v}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Centre for Smart Governance
          Description: EMS Notify - Employee Management System Notifier
           A system tray application for EMS notifications
          EOF
          
          dpkg-deb --build deb-package emsnotify-${GITHUB_REF#refs/tags/v}-amd64.deb
      
      - name: Build RPM
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          
          # Create spec file
          cat > ~/rpmbuild/SPECS/emsnotify.spec << 'EOF'
          Name:           emsnotify
          Version:        %{getenv:VERSION}
          Release:        1%{?dist}
          Summary:        EMS Notify - Employee Management System Notifier
          License:        Proprietary
          
          %description
          A system tray application for EMS notifications
          
          %install
          mkdir -p %{buildroot}/usr/bin
          mkdir -p %{buildroot}/usr/share/applications
          mkdir -p %{buildroot}/usr/share/icons/hicolor/256x256/apps
          cp %{getenv:GITHUB_WORKSPACE}/EmsNotify/build/EmsNotify %{buildroot}/usr/bin/
          cp %{getenv:GITHUB_WORKSPACE}/AppDir/usr/share/applications/emsnotify.desktop %{buildroot}/usr/share/applications/
          cp %{getenv:GITHUB_WORKSPACE}/EmsNotify/resources/icons/clock.png %{buildroot}/usr/share/icons/hicolor/256x256/apps/emsnotify.png
          
          %files
          /usr/bin/EmsNotify
          /usr/share/applications/emsnotify.desktop
          /usr/share/icons/hicolor/256x256/apps/emsnotify.png
          EOF
          
          VERSION=${GITHUB_REF#refs/tags/v} rpmbuild -bb ~/rpmbuild/SPECS/emsnotify.spec
          cp ~/rpmbuild/RPMS/x86_64/*.rpm .
      
      - name: Build Flatpak Manifest
        run: |
          mkdir -p flatpak-build
          cat > flatpak-build/org.csg.EmsNotify.yml << EOF
          app-id: org.csg.EmsNotify
          runtime: org.kde.Platform
          runtime-version: '6.8'
          sdk: org.kde.Sdk
          command: EmsNotify
          finish-args:
            - --socket=wayland
            - --socket=fallback-x11
            - --share=network
            - --device=dri
          modules:
            - name: emsnotify
              buildsystem: cmake
              sources:
                - type: archive
                  url: https://github.com/harsha-deep/EmsNotify/archive/refs/tags/${GITHUB_REF#refs/tags/}.tar.gz
                  sha256: REPLACEME
          EOF
          
          echo "Flatpak manifest created. Manual build required on Flathub."
      
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: '*.AppImage'
      
      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: '*.deb'
      
      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: '*.rpm'
      
      - name: Upload Flatpak Manifest
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-manifest
          path: flatpak-build/

  create-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-installer/EMSNotifySetup.exe
            linux-appimage/*.AppImage
            linux-deb/*.deb
            linux-rpm/*.rpm
          draft: false
          prerelease: false
          generate_release_notes: true
